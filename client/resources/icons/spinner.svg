<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <style>
    @keyframes scale {
      from {
        opacity: 1;
        scale: 1.125;
        }
      to {
        opacity: .5;
        scale: 1;
        }
    }
    #spinner circle {
      transform-origin: center;
      animation: scale .5s both infinite alternate;
    }
    #spinner circle:nth-child(1) { animation-delay: .1s; }
    #spinner circle:nth-child(2) { animation-delay: .2s; }
    #spinner circle:nth-child(3) { animation-delay: .3s; }
    #spinner circle:nth-child(4) { animation-delay: .4s; }
    #spinner circle:nth-child(5) { animation-delay: .5s; }
    #spinner circle:nth-child(6) { animation-delay: .6s; }
    #spinner circle:nth-child(7) { animation-delay: .7s; }
    #spinner circle:nth-child(8) { animation-delay: .8s; }
  </style>
  <circle id="s1" cx="8" cy="1" r="2"/>
  <circle id="s2" cx="13" cy="3" r="2"/>
  <circle id="s3" cx="15" cy="8" r="2"/>
  <circle id="s4" cx="13" cy="13" r="2"/>
  <circle id="s5" cx="8" cy="15" r="2"/>
  <circle id="s6" cx="3" cy="13" r="2"/>
  <circle id="s7" cx="1" cy="8" r="2"/>
  <circle id="s8" cx="3" cy="3" r="2"/>
</svg>
